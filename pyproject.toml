[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataformat-benchmark"
version = "0.1.0"
description = "Deterministic micro-benchmarks for common serialization formats"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
dataformat-benchmark = "dataformat_benchmark.runner:main"

[tool.setuptools.packages.find]
include = ["dataformat_benchmark*"]
